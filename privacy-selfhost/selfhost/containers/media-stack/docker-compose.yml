name: media-stack

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    networks:
      - mynetwork
    healthcheck:
        test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
        interval: 10s
        timeout: 3s
        retries: 3
        start_period: 10s
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${PROTON_WG_PRIVATE_KEY}
      - SERVER_COUNTRIES=Netherlands
      - FREE_ONLY=on
      # Allow VPN-routed apps to reach the Pi LAN and other services on mynetwork.
      - FIREWALL_OUTBOUND_SUBNETS=${ROUTER_SUBNET},${DOCKER_SUBNET}
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 9696:9696
      - 5080:5080
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=5080
      - TORRENTING_PORT=6881
    volumes:
      - /mnt/SSD/appdata/qbittorrent:/config
      - /mnt/SSD:/data
    restart: unless-stopped

  cross-seed:
    image: ghcr.io/cross-seed/cross-seed:latest
    container_name: cross-seed
    command: daemon
    networks:
      - mynetwork
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /mnt/SSD/appdata/cross-seed:/config
      - /mnt/SSD:/data
    restart: unless-stopped

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    networks:
      - mynetwork
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 8686:8686
    volumes:
      - /mnt/SSD/appdata/lidarr:/config
      - /mnt/SSD:/data
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    networks:
      - mynetwork
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 7878:7878
    volumes:
      - /mnt/SSD/appdata/radarr:/config
      - /mnt/SSD:/data
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    networks:
      - mynetwork
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /mnt/SSD/appdata/sonarr:/config
      - /mnt/SSD:/data
    ports:
      - 8989:8989
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /mnt/SSD/appdata/prowlarr:/config
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    networks:
      - mynetwork
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PORT=5055
    volumes:
      - /mnt/SSD/appdata/seerr:/app/config
    ports:
      - 5055:5055
    restart: unless-stopped

  jellyfin:
    image: linuxserver/jellyfin:latest
    container_name: jellyfin
    networks:
      - mynetwork
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /mnt/SSD/appdata/jellyfin:/config
      - /mnt/SSD/media:/data/media:ro
    group_add:
      - ${VIDEO}
      - ${RENDER}
    devices:
      - /dev/dri:/dev/dri
      - /dev/${VIDEO_DEVICE}:/dev/${VIDEO_DEVICE}
    ports:
      - 8096:8096
      - 7359:7359/udp
      #- 8920:8920 (HTTPS)
    restart: unless-stopped

  calibre-web-automated:
    image: crocodilestick/calibre-web-automated:latest
    container_name: calibre-web-automated
    networks:
      - mynetwork
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - CWA_AUTOCONVERT=true
      - NETWORK_SHARE_MODE=false
    volumes:
      - /mnt/SSD/appdata/calibre-web-automated:/config
      # CWA deletes files from its ingest directory after importing them.
      # Do not mount /mnt/SSD/torrents/books here: qBittorrent must retain it for seeding.
      - /mnt/SSD/appdata/calibre-web-automated/ingest:/cwa-book-ingest
      - /mnt/SSD/media/books:/calibre-library
    ports:
      - 8083:8083
    restart: unless-stopped

  shelfmark:
    image: ghcr.io/calibrain/shelfmark:latest
    container_name: shelfmark
    networks:
      - mynetwork
    depends_on:
      - calibre-web-automated
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - BOOK_LANGUAGE=en,fr
      - USE_BOOK_TITLE=true
      - MAX_CONCURRENT_DOWNLOADS=3
      #- HIDE_LOCAL_AUTH=true
      #- DISABLE_LOCAL_AUTH=true
      #- OIDC_AUTO_REDIRECT=true
    volumes:
      - /mnt/SSD/appdata/shelfmark:/config
      # CWA ingest directory -> Shelfmark /books
      - /mnt/SSD/appdata/calibre-web-automated/ingest:/books
      - /mnt/SSD:/data
    ports:
      - 8084:8084
    restart: unless-stopped

networks:
  mynetwork:
    external: true
